<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #ff6b6b;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        button:hover {
            background-color: #ff5252;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        h1 {
            color: white;
            font-size: 48px;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        h3 {
            color: #ffd700;
            font-size: 36px;
            margin: 20px 0 0 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .coin-display {
            width: 200px;
            height: 200px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            margin-top: 30px;
            transition: transform 0.6s ease;
        }

        .coin-display.flip {
            animation: flipCoin 0.6s ease;
        }

        @keyframes flipCoin {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }
    </style>
</head>
<body>
    <button></button>
    <h1></h1>
    <div class="coin-display"></div>
    <h3></h3>
</body>
<script>
    let button = document.querySelector('button');
    button.textContent = 'Toss';
    let h1 = document.querySelector('h1');
    let h3 = document.querySelector('h3');
    let coinDisplay = document.querySelector('.coin-display');

    button.addEventListener('click', function() {
        coinDisplay.classList.add('flip');
        
        setTimeout(function() {
            let randomNumber = Math.ceil(Math.random() * 2);
            console.log(randomNumber);
            if (randomNumber === 1) {
                h3.textContent = 'Head';
                coinDisplay.textContent = '☀️';
            } else {
                h3.textContent = 'Tail';
                coinDisplay.textContent = '🌙';
            }
            coinDisplay.classList.remove('flip');
        }, 300);
    });
</script>
</html>
